name: tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install test and plotting dependency
        run: python -m pip install "matplotlib>=3.8,<4"
      - name: Run offline unit tests
        run: cd rev3 && python -m unittest discover -s tests -t . -v
