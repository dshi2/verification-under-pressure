<text x="849" y="674" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800"><tspan x="849" dy="0">43,200</tspan></text>
<text x="850" y="706" fill="#d5e4ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="850" dy="0">60 items  ×  36 cells  ×  4 models  ×  5 repeats</tspan></text>
<text x="850" y="740" fill="#bcd0df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="850" dy="0">12 task families · 4 open-weight models</tspan></text>
<text x="57" y="823" fill="#64788b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400"><tspan x="57" dy="0">Current vs. stale describes the source snapshot; all offered/injected registry results are current.</tspan></text>
