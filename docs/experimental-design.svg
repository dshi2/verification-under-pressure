<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 756" role="img" aria-labelledby="title desc">
<title id="title">Verification Under Pressure: experimental design</title>
<desc id="desc">A three-panel academic schematic. A: turn 1 supplies a dated current or stale source with no tool, then turn 2 varies assigned right/wrong assertion, pressure and none/optional/supplied evidence; deterministic scoring reads final answers and raw lookup events. B: full randomized grid: 2 snapshots by 2 correctness by 3 pressure by 3 evidence routes, 60 items, 4 models, 5 repeats, 43,200 trials. C: E1 through E4 with family-clustered inference and assigned-denominator bounds.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#20242a}
.h{font-size:19px;font-weight:700}
.h2{font-size:16px;font-weight:700}
.t{font-size:15px}
.s{font-size:13px}
.xs{font-size:12px}
.bold{font-weight:700}
.muted{fill:#57616c}
.blue{fill:#edf5fc;stroke:#4381b8;stroke-width:1.5}
.purple{fill:#f3effb;stroke:#8b72b9;stroke-width:1.5}
.green{fill:#edf7f0;stroke:#579472;stroke-width:1.5}
.gray{fill:#f7f8fa;stroke:#9da9b5;stroke-width:1.4}
.orange{fill:#fff4eb;stroke:#cb905c;stroke-width:1.4}
.paper{fill:#fff;stroke:#9da9b5;stroke-width:1.3}
.line{fill:none;stroke:#63717f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rule{fill:none;stroke:#d2dae2;stroke-width:1}
</style>
<rect x="0" y="0" width="1120" height="756" fill="#fff"/>
<text x="18" y="30" class="h" >A. One trial: the first answer is shared; pressure and evidence vary at turn 2</text>
<rect x="18" y="48" width="286" height="222" rx="8" class="blue"/>
<text x="32" y="72" class="h2" >Turn 1: dated source</text>
<text x="32" y="96" class="s" >A neutral system instruction; dated excerpt</text>
<text x="32" y="116" class="s" >from a secondary source, either:</text>
<rect x="32" y="128" width="258" height="53" rx="5" class="paper"/>
<text x="43" y="148" class="s" >CURRENT  agrees with registry</text>
<text x="43" y="167" class="s" >STALE       disagrees with registry</text>
<text x="32" y="203" class="t bold" >No lookup tool is offered.</text>
<text x="32" y="226" class="s" >Model returns value A / B / unknown.</text>
<text x="32" y="250" class="s muted" >Answer recorded once per prefix.</text>
<path d="M304 161 H327 M320 155 L327 161 L320 167" class="line"/>
<rect x="330" y="48" width="448" height="222" rx="8" class="purple"/>
<text x="344" y="72" class="h2" >Turn 2: user assertion + evidence policy</text>
<text x="344" y="95" class="s" >Assertion assigned RIGHT or WRONG vs. current registry</text>
<text x="344" y="117" class="s" >Pressure: neutral / insistence / irrelevant authority</text>
<text x="344" y="137" class="s muted" >(four paraphrases per pressure condition)</text>
<text x="344" y="162" class="s bold" >Evidence route (three mutually exclusive arms):</text>
<rect x="344" y="173" width="132" height="69" rx="5" class="paper"/>
<rect x="482" y="173" width="133" height="69" rx="5" class="paper"/>
<rect x="621" y="173" width="142" height="69" rx="5" class="paper"/>
<text x="357" y="194" class="s bold" >NONE</text>
<text x="357" y="213" class="s" >No tool</text>
<text x="357" y="230" class="s" >available</text>
<text x="494" y="194" class="s bold" >OPTIONAL</text>
<text x="494" y="213" class="s" >lookup_record</text>
<text x="494" y="230" class="s" >offered to model</text>
<text x="633" y="194" class="s bold" >SUPPLIED</text>
<text x="633" y="213" class="s" >Current record</text>
<text x="633" y="230" class="s" >injected by harness</text>
<text x="344" y="258" class="xs muted" >The same stored first answer is reused across 18 turn-2 branches.</text>
<path d="M778 161 H801 M794 155 L801 161 L794 167" class="line"/>
<rect x="804" y="48" width="298" height="222" rx="8" class="green"/>
<text x="818" y="72" class="h2" >Scoring and outcomes</text>
<text x="818" y="97" class="s bold" >Deterministic; no LLM grader.</text>
<text x="818" y="120" class="s" >Read final answer and tool events:</text>
<text x="818" y="145" class="s" >• lookup attempted</text>
<text x="818" y="165" class="s" >• relevant record retrieved</text>
<text x="818" y="185" class="s" >• final answer correct / unknown</text>
<text x="818" y="205" class="s" >• invalid or missing response</text>
<text x="818" y="243" class="s muted" >Compare against registry truth.</text>
<path d="M18 292 H1102" class="rule"/>
<text x="18" y="323" class="h" >B. Randomized design and completed trial grid</text>
<rect x="18" y="342" width="1084" height="137" rx="8" class="gray"/>
<text x="36" y="368" class="s muted" >Source snapshot</text>
<text x="252" y="368" class="s muted" >User correctness</text>
<text x="473" y="368" class="s muted" >Pressure</text>
<text x="741" y="368" class="s muted" >Evidence route</text>
<text x="36" y="393" class="t bold" >2: current / stale</text>
<text x="252" y="393" class="t bold" >2: right / wrong</text>
<text x="473" y="393" class="t bold" >3: neutral / insist / authority</text>
<text x="741" y="393" class="t bold" >3: none / optional / supplied</text>
<path d="M36 406 H1084" class="rule"/>
<text x="36" y="433" class="t bold" >60 registry items (12 families) × 36 cells × 4 models × 5 repeats = 43,200 trials</text>
<text x="36" y="457" class="s" >Models: gpt-oss-120b · DeepSeek-V3.2 · Qwen3-235B · Kimi-K2</text>
<path d="M18 498 H1102" class="rule"/>
<text x="18" y="528" class="h" >C. Predefined contrasts (insistence versus neutral)</text>
<rect x="18" y="548" width="523" height="139" rx="8" class="paper"/>
<rect x="555" y="548" width="547" height="139" rx="8" class="paper"/>
<text x="34" y="574" class="t bold" >E1. Verification attempt</text>
<text x="34" y="596" class="s" >Δ lookup attempts, optional route</text>
<text x="34" y="624" class="t bold" >E2. Using supplied evidence</text>
<text x="34" y="646" class="s" >Δ accuracy, supplied route</text>
<text x="572" y="574" class="t bold" >E3. Evidence delivery effect</text>
<text x="572" y="596" class="s" >Mean of D(right) and D(wrong)</text>
<text x="572" y="624" class="t bold" >E4. User-correctness moderation</text>
<text x="572" y="646" class="s" >D(right) − D(wrong)</text>
<text x="18" y="715" class="s" >D(u) = [Δ accuracy under insistence, supplied] − [Δ accuracy under insistence, optional], at assigned user correctness u.</text>
<text x="18" y="737" class="s muted" >Inference clusters by record family; missing-outcome bounds retain all assigned trials. All offered or injected lookups use current records.</text>
</svg>
