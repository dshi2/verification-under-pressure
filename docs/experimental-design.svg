<text x="77" y="514" fill="#687b8b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="77" dy="0">Answer from available context</tspan></text>
<rect x="475" y="433" width="113" height="28" rx="14" fill="#e5f3f4"/>
<text x="488" y="452" fill="#116777" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750"><tspan x="488" dy="0">OPTIONAL</tspan></text>
<text x="476" y="488" fill="#203447" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650"><tspan x="476" dy="0">lookup_record offered</tspan></text>
<text x="476" y="514" fill="#687b8b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="476" dy="0">Model chooses whether to call</tspan></text>
<rect x="874" y="433" width="112" height="28" rx="14" fill="#f0ecfa"/>
<text x="887" y="452" fill="#664a9a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750"><tspan x="887" dy="0">SUPPLIED</tspan></text>
<text x="876" y="488" fill="#203447" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650"><tspan x="876" dy="0">Current registry injected</tspan></text>
<text x="876" y="514" fill="#687b8b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="876" dy="0">Correct-id call + result replayed</tspan></text>
<path d="M895 348 V373 H240 V414 M895 373 H640 V414 M895 373 H1040 V414" stroke="#97aabc" stroke-width="2" fill="none"/>
