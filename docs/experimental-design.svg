<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">Verification Under Pressure — experimental pipeline and contrasts</title>
<desc id="desc">Two-turn experiment. Turn one has no tools and reads a current or stale dated source. Turn two varies an assigned right or wrong user assertion, neutral, insistent or irrelevant authority wording, and none, optional or supplied evidence. A deterministic no-LLM-grader scorer tracks tool attempts and final accuracy. Four models, 60 registry items, 36 cells per item, five repetitions, 43,200 trials. E1 through E4 are the primary contrasts.</desc>
<rect width="1280" height="850" fill="#f6f9fc"/><rect x="0" y="0" width="1280" height="9" fill="#126e7a"/>
<text x="56" y="54" fill="#12263c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750"><tspan x="56" dy="0">VERIFICATION UNDER PRESSURE</tspan></text>
<text x="56" y="82" fill="#586b7d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="56" dy="0">What changes under insistence: choosing to verify, or using evidence already supplied?</tspan></text>
<rect x="56" y="111" width="482" height="237" rx="17" fill="#fff" stroke="#9fc7cc" stroke-width="1.4"/>
<rect x="56" y="111" width="482" height="43" rx="17" fill="#e5f3f4"/>
<text x="78" y="139" fill="#146575" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="78" dy="0">01   TURN 1  /  SHARED PREFIX</tspan></text>
<text x="78" y="177" fill="#1b3045" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650"><tspan x="78" dy="0">Dated secondary-source snapshot</tspan></text>
<text x="78" y="208" fill="#314e62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400"><tspan x="78" dy="0">CURRENT: agrees with today's registry</tspan></text>
<text x="78" y="235" fill="#314e62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400"><tspan x="78" dy="0">STALE: conflicts with today's registry</tspan></text>
<rect x="76" y="255" width="441" height="66" rx="11" fill="#f2f7f9"/>
<text x="93" y="279" fill="#223d52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="93" dy="0">No lookup tool offered. Model answers JSON:</tspan></text>
<text x="93" y="303" fill="#176b77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650"><tspan x="93" dy="0">value A / value B / unknown</tspan></text>
<rect x="565" y="111" width="659" height="237" rx="17" fill="#fff" stroke="#c9bbeb" stroke-width="1.4"/>
<rect x="565" y="111" width="659" height="43" rx="17" fill="#f0ecfa"/>
<text x="588" y="139" fill="#5f4c91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700"><tspan x="588" dy="0">02   TURN 2  /  RANDOMIZED FACTORS</tspan></text>
<text x="590" y="181" fill="#203447" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="590" dy="0">Assigned assertion</tspan></text>
<text x="590" y="204" fill="#455c70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400"><tspan x="590" dy="0">RIGHT  or  WRONG (vs. registry)</tspan></text>
<text x="590" y="244" fill="#203447" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="590" dy="0">Social pressure</tspan></text>
<text x="590" y="267" fill="#455c70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="590" dy="0">NEUTRAL / INSISTENCE / IRRELEVANT AUTHORITY</tspan></text>
<text x="590" y="311" fill="#5b6271" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="590" dy="0">One cached first answer is reused across 18 second-turn branches.</tspan></text>
<path d="M538 232 H565" stroke="#7993a5" stroke-width="2.5" fill="none"/><path d="M558 226 L565 232 L558 238" stroke="#7993a5" stroke-width="2" fill="none"/>
<text x="56" y="396" fill="#253f57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750"><tspan x="56" dy="0">03   EVIDENCE ROUTE (TURN 2 ONLY)</tspan></text>
<rect x="56" y="414" width="368" height="136" rx="17" fill="#fff" stroke="#d6e0e8" stroke-width="1.4"/><rect x="456" y="414" width="368" height="136" rx="17" fill="#fff" stroke="#d6e0e8" stroke-width="1.4"/><rect x="856" y="414" width="368" height="136" rx="17" fill="#fff" stroke="#d6e0e8" stroke-width="1.4"/>
