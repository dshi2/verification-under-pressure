<text x="78" y="608" fill="#2b4d67" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750"><tspan x="78" dy="0">04   DETERMINISTIC SCORING  /  NO LLM GRADER</tspan></text>
<text x="78" y="651" fill="#203447" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650"><tspan x="78" dy="0">Observable outcomes</tspan></text>
<text x="78" y="679" fill="#344e64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400"><tspan x="78" dy="0">Lookup attempted · relevant record retrieved · final answer correct</tspan></text>
<text x="78" y="710" fill="#344e64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="78" dy="0">E1: change in optional lookup attempts      E2: supplied-record accuracy change</tspan></text>
<text x="78" y="736" fill="#344e64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400"><tspan x="78" dy="0">E3: average delivery interaction                E4: user-correctness moderation</tspan></text>
<text x="78" y="761" fill="#536b7e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400"><tspan x="78" dy="0">Missing results bounded over assigned trials; repeats nested within items.</tspan></text>
<rect x="825" y="579" width="399" height="204" rx="17" fill="#132c43" stroke="#132c43" stroke-width="1.4"/>
